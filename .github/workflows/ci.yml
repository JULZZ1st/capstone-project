name: Project CI

"on":
  pull_request:
  push:
    branches: [main, julius, gina]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Laravel tests and asset build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      AUTH_EMAIL_VALIDATE_DNS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, dom, fileinfo, gd, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Prepare isolated test environment
        run: cp .env.example .env
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary app key
        run: php artisan key:generate --force
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Run application tests
        run: php artisan test --compact
